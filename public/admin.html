<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商城 · 商家管理后台</title>
  <link rel="stylesheet" href="/admin.css" />
  <style>#roleConflict{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px 22px;max-width:82%;text-align:center;font-size:14px;line-height:1.6;box-shadow:0 6px 24px rgba(0,0,0,.12);z-index:9999}</style>
</head>
<body>
  <!-- 登录页 -->
  <div id="loginView" class="login-wrap hide">
    <form class="login-card" id="loginForm">
      <h2>商家管理后台</h2>
      <div class="field"><label>账号</label><input id="aUser" placeholder="admin" autocomplete="username"></div>
      <div class="field"><label>密码</label><input id="aPass" type="password" placeholder="admin123" autocomplete="current-password"></div>
      <button class="btn block" type="submit">登录</button>
      <div class="hint">默认账号 admin / admin123</div>
    </form>
  </div>

  <!-- 主框架 -->
  <div id="adminView" class="admin hide">
    <aside class="side">
      <div class="logo" id="sideShop">商城后台</div>
      <nav>
        <a data-tab="dashboard" class="active">📊 仪表盘</a>
        <a data-tab="products">📦 商品管理</a>
        <a data-tab="orders">🧾 订单管理</a>
        <a data-tab="customers">👥 客户管理</a>
        <a data-tab="inventory">🏬 库存管理</a>
        <a data-tab="settings">⚙️ 店铺设置</a>
      </nav>
      <div class="side-foot"><span id="sideUser"></span><button class="link" id="btnLogout">退出</button></div>
    </aside>
    <main class="content"><div id="view" class="view"></div></main>
  </div>

  <div id="modal" class="modal-mask hide" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modalBox"></div>
  </div>
  <div id="toast" class="toast hide"></div>
  <div id="roleConflict" class="hide"></div>
  <script src="/role-guard.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
