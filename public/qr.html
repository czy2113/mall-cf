<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双端二维码 · 商城</title>
<style>
  :root { --brand:#ff5722; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
         background:#f5f6f8; color:var(--ink); }
  .wrap { max-width:720px; margin:0 auto; padding:28px 18px 48px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 24px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:560px){ .grid{ grid-template-columns:1fr; } }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px 18px; text-align:center;
          box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .badge { display:inline-block; font-size:12px; font-weight:600; padding:4px 12px; border-radius:999px; margin-bottom:14px; }
  .badge.cust { background:#e6f1fb; color:#185fa5; }
  .badge.merc { background:#eaf3de; color:#3b6d11; }
  .qr { width:200px; height:200px; margin:0 auto 14px; display:flex; align-items:center; justify-content:center; }
  .qr img { width:200px; height:200px; image-rendering:pixelated; }
  .portal { font-size:17px; font-weight:600; margin:2px 0 6px; }
  .desc { font-size:13px; color:var(--muted); line-height:1.6; min-height:40px; }
  .url { font-size:12px; color:#9aa0a6; word-break:break-all; margin-top:10px; background:#f7f8fa; border-radius:8px; padding:6px 8px; }
  .note { margin-top:26px; font-size:13px; color:var(--muted); background:#fff; border:1px solid var(--line);
          border-radius:12px; padding:14px 16px; line-height:1.7; }
  .note b { color:var(--ink); }
  .foot { text-align:center; color:#9aa0a6; font-size:12px; margin-top:22px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>商城双端访问二维码</h1>
  <p class="sub">用手机扫描对应二维码，即可进入顾客端或商家端。两端共享同一套后端系统，按角色区分界面与权限。</p>

  <div class="grid">
    <div class="card">
      <span class="badge cust">顾客端 · USER</span>
      <div class="qr" id="custQr"></div>
      <div class="portal">顾客购物入口</div>
      <div class="desc">浏览商品、加入购物车、下单支付、查看我的订单。</div>
      <div class="url" id="custUrl"></div>
    </div>
    <div class="card">
      <span class="badge merc">商家端 · ADMIN</span>
      <div class="qr" id="mercQr"></div>
      <div class="portal">商家管理入口</div>
      <div class="desc">商品与库存管理、订单处理、经营数据统计。</div>
      <div class="url" id="mercUrl"></div>
    </div>
  </div>

  <div class="note">
    <b>权限说明：</b>顾客端仅接受顾客账号（user 角色），商家端仅接受商家账号（admin 角色）。
    若用商家账号误扫顾客码，系统会自动引导至商家端；反之亦然。真正的权限校验由后端 JWT 强制完成，前端仅做路由引导。
  </div>

  <div class="foot">本页二维码基于当前站点地址自动生成，部署到任意域名均无需改动。</div>
</div>

<script src="/vendor/qrcode.js"></script>
<script>
  // 基于当前站点 origin 生成双端二维码，部署到任何域名都自动适配
  function makeQr(text) {
    for (var t = 4; t <= 12; t++) {
      try { var qr = qrcode(t, 'M'); qr.addData(text); qr.make(); return qr.createImgTag(6, 8); } catch (e) {}
    }
    var qr = qrcode(12, 'L'); qr.addData(text); qr.make(); return qr.createImgTag(6, 8);
  }
  var origin = location.origin;
  var custUrl = origin + '/';
  var mercUrl = origin + '/admin';
  document.getElementById('custUrl').textContent = custUrl;
  document.getElementById('mercUrl').textContent = mercUrl;
  document.getElementById('custQr').innerHTML = makeQr(custUrl);
  document.getElementById('mercQr').innerHTML = makeQr(mercUrl);
</script>
</body>
</html>
